name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "herramientas/comprobar_publicacion.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to golembench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WRANGLER_SEND_METRICS: "false"
      PAGES_PROJECT: golembench

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Solo se publica site/. Si aparece algo del piloto o del prototipo del Lab,
      # el despliegue se detiene aquí (ver CLAUDE.md, «Antes de publicar el Lab»).
      - name: Puerta de publicación
        run: python3 -I herramientas/comprobar_publicacion.py site

      # La zona de Cloudflare guarda CSS y JS 4 horas en el navegador. Con una huella
      # vieja, quien ya visitó vería el HTML nuevo con estilos viejos.
      - name: Huellas de versión de CSS y JS
        run: python3 -I herramientas/versionar_recursos.py --comprobar

      # Como en simioplateado, Pages es un proyecto de «direct upload»: el primer
      # despliegue lo crea; los siguientes lo encuentran y siguen de largo.
      - name: Crear el proyecto de Pages si no existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "El proyecto $PAGES_PROJECT ya existe."
          else
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # El dashboard de Cloudflare mostrará «No Git connection»: es lo esperado.
          # Los despliegues llegan desde aquí con cada push a main que toque site/.
          command: pages deploy site --project-name=golembench --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
